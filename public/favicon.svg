<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The ringed planet from the first site (elammaryo/cosmic-portfolio), kept as it was:
       the hero's planet is back, so the tab shows it too. -->
  <defs>
    <radialGradient id="planet" cx="30%" cy="22%" r="85%">
      <stop stop-color="#e1d9ff"/>
      <stop offset=".4" stop-color="#a08aff"/>
      <stop offset="1" stop-color="#5941bb"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#77e4dc"/>
      <stop offset=".6" stop-color="#d5c6ff"/>
      <stop offset="1" stop-color="#ffc98b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#101024"/>
  <g transform="rotate(-30 32 32)">
    <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#7667aa" stroke-width="3"/>
    <circle cx="32" cy="32" r="17" fill="url(#planet)"/>
    <path d="M6 32a26 10 0 0 0 52 0" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <circle cx="49" cy="12" r="3" fill="#ffce93"/>
</svg>
